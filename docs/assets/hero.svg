<text class="small" x="718" y="303" text-anchor="middle">18 x 18 average payoffs</text>

<!-- 4. Ranking -->
<text class="stage" x="894" y="139">RANKING</text>
<rect class="purple-fill" x="896" y="153" width="238" height="42" rx="8"/>
<rect class="gray-fill" x="896" y="205" width="214" height="38" rx="8"/>
<rect class="gray-fill" x="896" y="253" width="190" height="38" rx="8"/>
