  <rect class="grid" x="115" y="23" width="23" height="23"/>
  <rect class="grid" x="0" y="46" width="23" height="23"/>
  <rect class="grid" x="23" y="46" width="23" height="23"/>
  <rect class="grid-hot" x="46" y="46" width="23" height="23"/>
  <rect class="grid" x="69" y="46" width="23" height="23"/>
  <rect class="grid" x="92" y="46" width="23" height="23"/>
  <rect class="grid-accent" x="115" y="46" width="23" height="23"/>
  <rect class="grid-accent" x="0" y="69" width="23" height="23"/>
  <rect class="grid" x="23" y="69" width="23" height="23"/>
  <rect class="grid" x="46" y="69" width="23" height="23"/>
  <rect class="grid-hot" x="69" y="69" width="23" height="23"/>
  <rect class="grid" x="92" y="69" width="23" height="23"/>
  <rect class="grid" x="115" y="69" width="23" height="23"/>
  <rect class="grid" x="0" y="92" width="23" height="23"/>
  <rect class="grid-accent" x="23" y="92" width="23" height="23"/>
  <rect class="grid" x="46" y="92" width="23" height="23"/>
