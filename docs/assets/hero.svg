<svg width="100%" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Iterated Prisoner's Dilemma Strategies</title>
<desc id="hero-desc">Eighteen strategies flow through a round-robin tournament, an eighteen-by-eighteen payoff matrix, and a final ranking.</desc>
<style>
  .title    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; font-weight: 650; fill: #2C2C2A; letter-spacing: -0.4px; }
  .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #5F5E5A; }
  .stage    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #534AB7; letter-spacing: 1.5px; }
  .label    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #2C2C2A; }
  .small    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; fill: #5F5E5A; }
  .move     { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 600; fill: #2C2C2A; letter-spacing: 0.5px; }
  .rank     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #534AB7; }
  .panel       { fill: #FAF9F6; stroke: #D9D7CF; stroke-width: 0.8; }
  .gray-fill   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
  .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.9; }
  .teal-fill   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.9; }
  .grid        { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.65; }
  .grid-hot    { fill: #B7E3D3; stroke: #0F6E56; stroke-width: 0.65; }
  .grid-accent { fill: #CECBF6; stroke: #534AB7; stroke-width: 0.65; }
  .edge     { stroke: #9C9A92; stroke-width: 1; fill: none; }
  .flow     { stroke: #534AB7; stroke-width: 1.7; fill: none; }
  .bar      { fill: #0F6E56; }
  .bar-soft { fill: #8AC9B4; }
  .marker-stroke { stroke: #534AB7; }
  @media (prefers-color-scheme: dark) {
    .title    { fill: #E5E5E2; }
    .subtitle { fill: #B4B2A9; }
    .stage    { fill: #AFA9EC; }
    .label    { fill: #E5E5E2; }
    .small    { fill: #B4B2A9; }
    .move     { fill: #E5E5E2; }
    .rank     { fill: #AFA9EC; }
    .panel       { fill: #242422; stroke: #5F5E5A; }
    .gray-fill   { fill: #444441; stroke: #B4B2A9; }
    .purple-fill { fill: #3C3489; stroke: #AFA9EC; }
    .teal-fill   { fill: #085041; stroke: #5DCAA5; }
    .grid        { fill: #3A3A37; stroke: #73726C; }
    .grid-hot    { fill: #0F6E56; stroke: #5DCAA5; }
    .grid-accent { fill: #534AB7; stroke: #AFA9EC; }
    .edge     { stroke: #73726C; }
    .flow     { stroke: #AFA9EC; }
    .bar      { fill: #5DCAA5; }
    .bar-soft { fill: #2D8068; }
    .marker-stroke { stroke: #AFA9EC; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path class="marker-stroke" d="M2 1L8 5L2 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text class="title" x="52" y="58">Iterated Prisoner's Dilemma Strategies</text>
<text class="subtitle" x="54" y="86">18-strategy round robin on socsim-games</text>

<!-- Stage panels and flow connectors -->
<rect class="panel" x="48" y="116" width="232" height="194" rx="10"/>
<rect class="panel" x="326" y="116" width="238" height="194" rx="10"/>
<rect class="panel" x="610" y="116" width="222" height="194" rx="10"/>
<rect class="panel" x="878" y="116" width="274" height="194" rx="10"/>
<path class="flow" d="M280 213H318" marker-end="url(#arrow)"/>
<path class="flow" d="M564 213H602" marker-end="url(#arrow)"/>
<path class="flow" d="M832 213H870" marker-end="url(#arrow)"/>

<!-- 1. Strategy nodes -->
<text class="stage" x="64" y="139">STRATEGIES</text>
<rect class="teal-fill" x="64" y="154" width="92" height="36" rx="8"/>
<rect class="gray-fill" x="168" y="154" width="96" height="36" rx="8"/>
<rect class="gray-fill" x="64" y="202" width="92" height="36" rx="8"/>
<rect class="purple-fill" x="168" y="202" width="96" height="36" rx="8"/>
<text class="label" x="110" y="177" text-anchor="middle">TFT</text>
<text class="label" x="216" y="177" text-anchor="middle">Gradual</text>
<text class="label" x="110" y="225" text-anchor="middle">Extort-2</text>
<text class="label" x="216" y="225" text-anchor="middle">all_d</text>
<text class="small" x="164" y="273" text-anchor="middle">+ ... 18 strategies</text>
<text class="small" x="164" y="293" text-anchor="middle">9 library · 9 repository</text>

<!-- 2. Round-robin network: edges first, then nodes -->
<text class="stage" x="342" y="139">ROUND ROBIN</text>
<path class="edge" d="M368 168L444 153L519 168L368 168L397 208L492 208L519 168M444 153L397 208M444 153L492 208M368 168L492 208M519 168L397 208"/>
<circle class="teal-fill" cx="368" cy="168" r="11"/>
<circle class="gray-fill" cx="444" cy="153" r="11"/>
<circle class="purple-fill" cx="519" cy="168" r="11"/>
<circle class="gray-fill" cx="397" cy="208" r="11"/>
<circle class="teal-fill" cx="492" cy="208" r="11"/>
<rect class="gray-fill" x="348" y="237" width="194" height="55" rx="8"/>
<text class="move" x="362" y="258">A  C C D C ...</text>
<text class="move" x="362" y="277">B  C D D C ...</text>
<text class="small" x="528" y="228" text-anchor="end">200 rounds · 30 seeds</text>

